<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Google Accounts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #202124; color: #e8eaed; min-height: 100vh; display: flex; flex-direction: column; padding: 24px 28px; }
    .g-header { display: flex; align-items: center; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid #3c4043; margin-bottom: 24px; }
    .g-header-title { font-size: 1rem; font-weight: 500; color: #e8eaed; }
    .g-title { font-size: 1.8rem; font-weight: 400; color: #e8eaed; margin-bottom: 8px; }
    .g-sub { font-size: 1rem; color: #9aa0a6; margin-bottom: 28px; }
    .g-sub strong { color: #8ab4f8; font-weight: 500; }
    
    .account-card {
      display: flex; align-items: center; gap: 14px; padding: 14px 16px;
      border-radius: 8px; cursor: pointer; transition: background .15s ease;
      margin-bottom: 8px; border: 1px solid #3c4043;
    }
    .account-card:hover { background: #3c4043; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; background: #8ab4f8; color: #202124;
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 600;
    }
    .acc-name { font-size: .95rem; font-weight: 500; color: #e8eaed; }
    .acc-email { font-size: .82rem; color: #9aa0a6; margin-top: 2px; }
    
    .other-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid #3c4043; }
    .other-label { font-size: .88rem; color: #9aa0a6; margin-bottom: 10px; }
    .input-row { display: flex; gap: 10px; }
    .g-input {
      flex: 1; padding: 12px 14px; background: #202124; border: 1px solid #5f6368;
      border-radius: 6px; color: #e8eaed; font-size: .92rem; outline: none;
    }
    .g-input:focus { border-color: #8ab4f8; }
    .g-btn {
      padding: 12px 20px; background: #8ab4f8; color: #202124; border: none;
      border-radius: 6px; font-size: .9rem; font-weight: 600; cursor: pointer;
    }
    .g-btn:hover { background: #aecbfa; }
    .err-msg { color: #f28b82; font-size: .82rem; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <div class="g-header">
    <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
    <div class="g-header-title">Sign in with Google</div>
  </div>

  <h1 class="g-title">Choose an account</h1>
  <p class="g-sub">to continue to <strong>DocAvail</strong></p>

  <div id="accounts-list">
    <div class="account-card" onclick="chooseAccount('user.patient@gmail.com', 'Patient User')">
      <div class="avatar">P</div>
      <div>
        <div class="acc-name">Patient User</div>
        <div class="acc-email">user.patient@gmail.com</div>
      </div>
    </div>
  </div>

  <div class="other-section">
    <div class="other-label">Use another Google email:</div>
    <div class="input-row">
      <input type="email" id="email-input" class="g-input" placeholder="Email or phone">
      <button class="g-btn" onclick="submitCustomEmail()">Continue</button>
    </div>
    <div id="err-text" class="err-msg">Please enter a valid Google email</div>
  </div>

  <script>
    function chooseAccount(email, name) {
      if (window.opener) {
        window.opener.postMessage({ type: 'GOOGLE_AUTH_SUCCESS', email: email, name: name }, '*');
      }
      window.close();
    }

    function submitCustomEmail() {
      const email = document.getElementById('email-input').value.trim();
      const err = document.getElementById('err-text');
      err.style.display = 'none';
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        err.style.display = 'block';
        return;
      }
      const name = email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      chooseAccount(email, name);
    }
  </script>
</body>
</html>
